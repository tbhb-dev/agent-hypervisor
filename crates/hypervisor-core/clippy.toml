  { path = "std::env::set_var", reason = "the environment belongs to the shell" },
  { path = "std::env::remove_var", reason = "the environment belongs to the shell" },
  { path = "std::env::current_dir", reason = "read the working directory in the shell and pass it in" },
  { path = "std::env::set_current_dir", reason = "the working directory belongs to the shell" },
  { path = "std::env::current_exe", reason = "read it in the shell and pass it in" },
  { path = "std::env::home_dir", reason = "read it in the shell and pass it in" },
  { path = "std::env::temp_dir", reason = "read it in the shell and pass it in" },
  # Clocks
  { path = "std::time::SystemTime::now", reason = "read the clock in the shell and pass the time in" },
  { path = "std::time::Instant::now", reason = "read the clock in the shell and pass the time in" },
