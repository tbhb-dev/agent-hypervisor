# Vale configuration. Styles come from vale-ai-tells (https://github.com/tbhb/vale-ai-tells), pinned by release URL.
# `mise run vale:sync` downloads them into .vale/styles, which is gitignored.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[formats]
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = ai-tells

[{COMMIT_EDITMSG,**/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits
