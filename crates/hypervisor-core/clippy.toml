# Functional core: no I/O. Clippy reads the clippy.toml beside a crate's Cargo.toml, so this file
# applies to this crate only. Every `-core` crate carries an identical copy. `check:boundary` fails
# when a copy is missing or lacks a ban listed in `xtask_core::boundary::REQUIRED_BANS`.
# Pass values in from the shell instead of calling any of these.
disallowed-methods = [
  # Files
  { path = "std::fs::read", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::read_to_string", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::read_dir", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::read_link", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::write", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::copy", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::rename", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::create_dir", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::create_dir_all", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::remove_file", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::remove_dir", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::remove_dir_all", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::metadata", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::symlink_metadata", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::canonicalize", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::exists", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::hard_link", reason = "file I/O belongs in a shell crate" },
  { path = "std::fs::set_permissions", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::exists", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::metadata", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::read_dir", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::canonicalize", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::is_file", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::is_dir", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::try_exists", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::symlink_metadata", reason = "file I/O belongs in a shell crate" },
  { path = "std::path::Path::read_link", reason = "file I/O belongs in a shell crate" },
  # Network
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "network I/O belongs in a shell crate" },
  { path = "std::net::TcpStream::connect", reason = "network I/O belongs in a shell crate" },
  { path = "std::net::TcpListener::bind", reason = "network I/O belongs in a shell crate" },
  { path = "std::net::UdpSocket::bind", reason = "network I/O belongs in a shell crate" },
  # Processes
  { path = "std::process::exit", reason = "process control belongs in a shell crate" },
  { path = "std::process::abort", reason = "process control belongs in a shell crate" },
  { path = "std::process::id", reason = "process state belongs in a shell crate" },
  # Environment
  { path = "std::env::var", reason = "read the environment in the shell and pass the value in" },
  { path = "std::env::var_os", reason = "read the environment in the shell and pass the value in" },
  { path = "std::env::vars", reason = "read the environment in the shell and pass the value in" },
  { path = "std::env::vars_os", reason = "read the environment in the shell and pass the value in" },
