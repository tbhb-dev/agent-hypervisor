# Every tool is pinned to an exact version so local runs and CI resolve the same binaries.
# Move a pin deliberately and record the new version in the PR that moves it.
# The pins match tbhb-dev/agent-orchestration-poc at 88584e3. mise owns the Rust pin; there is no rust-toolchain.toml.
[tools]
# Ghostty a60e9e2a5 sets minimum_zig_version = "0.16.0" in build.zig.zon; ghostty-vt-sys builds with it.
zig = "0.16.0"
rust = { version = "1.98.1", profile = "default" }
go = "1.27.1"
python = "3.14.6"
uv = "0.12.10"
gitleaks = "8.30.1"
prek = "0.5.1"
rumdl = "0.2.48"
tombi = "1.5.0"
vale = "3.22.0"
actionlint = "1.7.12"
"pipx:ryl" = "0.22.0"
"go:github.com/tbhb/repotools/cmd/guard-markdown" = "0.9.0"

[env]
# A go.mod toolchain mismatch fails instead of downloading a Go outside mise.
GOTOOLCHAIN = "local"
# uv otherwise prefers its own managed interpreters over the Python mise pins above.
UV_PYTHON_PREFERENCE = "only-system"

# Aggregates. `check` is what CI and workers run; `fmt` applies every formatter.
[tasks.check]
description = "Run every check and the tests"
depends = [
  "check:fmt",
  "check:clippy",
  "check:test",
  "check:boundary",
  "check:secrets",
  "check:actions",
  "check:guard-markdown",
  "check:rumdl",
  "check:vale",
  "check:tombi",
  "check:ryl",
]

[tasks.fmt]
description = "Apply every formatter"
run = ["cargo fmt --all", "tombi format"]

[tasks.build]
description = "Build every workspace crate"
run = "cargo build --workspace --locked"

[tasks."guest:build"]
description = "Cross-build the Linux arm64 guest agent for Apple container"
run = [
  "rustup target add aarch64-unknown-linux-musl",
  'RUSTFLAGS="-C linker-flavor=ld.lld -C linker=$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin/rust-lld" cargo build --locked --target aarch64-unknown-linux-musl --no-default-features --features guest -p hypervisord --bin host-shim',
]

# Rust
[tasks."check:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."check:clippy"]
description = "Lint every Rust target with clippy, warnings as errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."check:test"]
description = "Run the Rust tests, including the conformance harness; launchd needs check:host"
run = "bash tests/check-fixtures.sh"

[tasks."check:host"]
description = "Run the launchd and seatbelt integration tests on an unsandboxed macOS host before merge"
run = "bash tests/check-fixtures.sh host"

[tasks."check:boundary"]
description = "Fail when a -core crate depends outside the allowlist or lacks its clippy.toml"
run = "cargo run --quiet --locked -p xtask -- boundary"

# Prose
[tasks."vale:sync"]
description = "Download the pinned Vale styles into .vale/styles"
run = "vale sync"

[tasks."check:vale"]
description = "Lint prose with Vale (ai-tells), syncing the styles on first use"
run = [
  "test -d .vale/styles/ai-tells -a -d .vale/styles/ai-tells-commits || vale sync",
  "git ls-files --cached --others --exclude-standard -- '*.md' | xargs vale",
]

[tasks."check:rumdl"]
description = "Lint Markdown with rumdl"
run = "rumdl check ."

[tasks."check:guard-markdown"]
description = "Check that no Markdown paragraph is hard-wrapped"
run = "git ls-files --cached --others --exclude-standard -- '*.md' | xargs guard-markdown"

# YAML and TOML
[tasks."check:ryl"]
description = "Lint YAML with ryl"
run = "ryl check ."

[tasks."check:tombi"]
description = "Lint and check formatting of TOML with tombi"
run = ["tombi lint", "tombi format --check"]

# Repository rules
[tasks."check:secrets"]
description = "Scan the git history for secrets with gitleaks"
run = "gitleaks git --redact --no-banner ."

[tasks."check:actions"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

# Ghostty
[tasks."ghostty:bindings"]
description = "Regenerate the committed ghostty-vt-sys bindings from the pinned Ghostty headers"
usage = 'arg "[source]" help="A local Ghostty clone that contains the pinned commit; fetched from GitHub when omitted"'
run = '''
set -euo pipefail
pin="$(cat crates/ghostty-vt-sys/ghostty.pin)"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
if [ -n "${usage_source:-}" ]; then
  git -C "$usage_source" archive "$pin" include | tar -x -C "$tmp"
else
  git -C "$tmp" init -q
  git -C "$tmp" fetch -q --depth 1 https://github.com/ghostty-org/ghostty.git "$pin"
  git -C "$tmp" checkout -q FETCH_HEAD -- include
fi
mise exec cargo:bindgen-cli@0.73.2 -- bindgen "$tmp/include/ghostty/vt.h" \
  --allowlist-type 'Ghostty.*' --allowlist-function 'ghostty_.*' --allowlist-var 'GHOSTTY_.*' \
  --no-prepend-enum-name --with-derive-default --use-core --merge-extern-blocks --no-doc-comments \
  --rust-target 1.85 --rust-edition 2024 --output crates/ghostty-vt-sys/src/bindings.rs -- "-I$tmp/include"
'''
